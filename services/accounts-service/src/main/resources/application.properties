spring.application.name=accounts-service

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accounts}
spring.datasource.username=${DB_USERNAME:dfp}
spring.datasource.password=${DB_PASSWORD:dfp_local_password}

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info