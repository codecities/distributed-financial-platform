services:
  postgres:
    image: postgres:17
    container_name: dfp-postgres
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: dfp
      POSTGRES_PASSWORD: dfp_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfp -d accounts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
